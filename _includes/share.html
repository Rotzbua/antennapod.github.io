{% assign author = site.data.authors[page.author] %}

<!--<div class="inline-flex">-->
<ul class="list-group list-group-horizontal">
  <li class="list-group-item">
    {% t generic.share %}
  </li>
  <li class="list-group-item">
    <a href="#"
       onclick="copyUrl();"
       data-bs-toggle="tooltip"
       aria-label="{% t generic.accessibility.copy %}" title="{% t generic.accessibility.copy %}">
      <i class="fas fa-copy color-gray-600 size-20 mr-2"></i>
    </a>
  </li>
  <li class="list-group-item">
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ page.url | replace: '.html', '' }}"
       onclick="window.open(this.href, 'facebook-share','width=580,height=296');return false;"
       data-bs-toggle="tooltip"
       aria-label="{% t generic.accessibility.share-fb %}" title="{% t generic.accessibility.share-fb %}">
      <i class="fab fa-facebook color-gray-600 size-20 mr-2"></i>
    </a>
  </li>
  <li class="list-group-item">
    <a href="#"
       onclick="share_on_mastodon();"
       data-bs-toggle="tooltip"
       aria-label="{% t generic.accessibility.share-md %}" title="{% t generic.accessibility.share-md %}">
      <i class="fab fa-mastodon size-20 color-gray-600 mr-2"></i>
    </a>
  </li>
  <li class="list-group-item">
    <a href="https://twitter.com/intent/tweet?text={{ site.url }}{{ page.url | replace: '.html', '' }}&hashtags={% for tag in page.tags %}{{tag}},{% endfor %}"
       onclick="window.open(this.href, 'twitter-share', 'width=550,height=350');return false;"
       data-bs-toggle="tooltip"
       aria-label="{% t generic.accessibility.share-tw %}" title="{% t generic.accessibility.share-tw %}">
      <i class="fab fa-twitter size-20 color-gray-600 mr-2"></i>
    </a>
  </li>
  <li class="list-group-item">
    <a href="mailto:?subject={% t generic.eml-share.subject %}&amp;body={% t generic.eml-share.subject %} {{ site.url }}{{ page.url | replace: '.html', '' }}"
       data-bs-toggle="tooltip"
       aria-label="{% t generic.accessibility.share-eml %}" title="{% t generic.accessibility.share-eml %}">
      <i class="fas fa-envelope size-20 color-gray-600"></i>
    </a>
  </li>
</ul>
<!--</div>-->

<script>
  // Create tooltips.
  document.addEventListener('DOMContentLoaded',
    () => {
      const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
      const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
    }
  )
</script>

<script>
  // The actual function. Set this as an onclick function for your "Share on Mastodon" button.
  function share_on_mastodon() {
    // Prefill the form with the user's previously-specified Mastodon instance, if applicable
    let default_url = localStorage['mastodon_instance'];

    // If there is no cached instance/domain, then insert a "https://" with no domain at the start of the prompt.
    if(!default_url)
      default_url = "https://";

    let instance = prompt("{% t generic.masto-share.server %}", default_url);
    if(instance) {
      // Handle URL formats
      if(!instance.startsWith("https://") && !instance.startsWith("http://"))
        instance = "https://" + instance;

      // Get the current page's URL
      const url = window.location.href;

      // Get the page title from the og:title meta tag, if it exists.
      let title = document.querySelectorAll('meta[property="og:title"]')[0].getAttribute("content");

      // Otherwise, use the <title> tag as the title
      if(!title) { title = document.getElementsByTagName("title")[0].innerHTML; }

      // Handle slash
      if(!instance.endsWith("/"))
        instance = instance + "/";

      // Cache the instance/domain for future requests
      localStorage['mastodon_instance'] = instance;

      // Hashtags
      const hashtags = "{{ page.tags }}";

      // Tagging users, such as official accounts or the author of the post
      const author = "{{ author.name }}";

      // Create the Share URL
      // https://someinstance.tld/share?text=URL%20encoded%20text
      const mastodon_url = instance + "share?text=" + encodeURIComponent(title + "\n\n" + url + "\n\n" + hashtags + " " + author);

      // Open a new window at the share location
      window.open(mastodon_url, '_blank');
    }
  }
</script>
