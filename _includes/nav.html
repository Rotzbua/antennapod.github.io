<header class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
	<nav class="container-xxl bd-gutter flex-wrap flex-lg-nowrap">
		
		<a class="navbar-brand" href="/{% if site.lang != 'en' %}{{ site.lang }}{% endif %}">
			<img class="smallermobile" src="/assets/logos/logo.png" id="mainlogo"/>
		</a>
		
		<ul class="navbar-nav justify-content-end">
			{% for link in site.data.navbar %}
			<li class="nav-item">
				<a class="nav-link" href="{% unless link.url contains 'http' %}{{ site.baseurl }}{% endunless %}{{ link.url }}">
					{% t {{ link.key }} %}
				</a>
			</li>
			{% endfor %}
		</ul>
		<ul class="navbar-nav justify-content-end">
			<li class="nav-item dropdown">
				<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
					<i class="fa fa-globe"></i>
					<span class="ml-1 weight-600">{{ site.lang | upcase }}</span>
				</a>
				{% include nav_languages.html %}
			</li>
		
		</ul>
		
		<li class="nav-item dropdown">
			<button class="btn btn-link nav-link py-2 px-0 px-lg-2 dropdown-toggle d-flex align-items-center"
					id="bd-theme"
					type="button"
					aria-expanded="false"
					data-bs-toggle="dropdown"
					data-bs-display="static"
					aria-label="Toggle theme (auto)">
					<span class="d-lg-none ms-2" id="bd-theme-text">Toggle theme</span>
			</button>
			<ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bd-theme-text">
				<li>
					<button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light" aria-pressed="false">
						Light
					</button>
				</li>
				<li>
					<button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark" aria-pressed="false">
						Dark
					</button>
				</li>
				<li>
					<button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="auto" aria-pressed="true">
						Auto
					</button>
				</li>
			</ul>
		</li>
	
	</nav>
</header>
